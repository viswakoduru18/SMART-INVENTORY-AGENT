[project]
name = "smart-inventory"
version = "1.0.0"
description = "Acintyo Predictive Distribution Intelligence Platform: smart inventory, bounce intelligence, sourcing and dynamic discounting beside the ERP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
smart-inventory = "smart_inventory.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["smart_inventory*"]

[tool.setuptools.package-data]
smart_inventory = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
